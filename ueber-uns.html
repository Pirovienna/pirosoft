<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Über uns &amp; Markenstrategie - PiroMed Office</title>
  <style>
    body {
      margin: 0;
      background-color: #121316;
      color: #ffffff;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      padding: 25px 20px 50px 20px;
    }
    .container {
      max-width: 860px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    .brand-title {
      font-size: 38px;
      font-weight: 800;
      color: #c9f24c;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .brand-title a {
      color: #c9f24c;
      text-decoration: none;
    }
    .brand-claim {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.6px;
      color: #9da7b3;
      margin-bottom: 25px;
    }
    nav {
      margin-bottom: 35px;
      text-align: center;
      font-size: 15px;
      line-height: 1.6;
      color: #6e7681;
    }
    nav a {
      color: #ffffff;
      text-decoration: none;
      margin: 0 6px;
      font-weight: 500;
    }
    nav a:hover {
      color: #c9f24c;
      text-decoration: underline;
    }
    h1 {
      color: #ffffff;
      font-size: 26px;
      margin-bottom: 15px;
      text-align: center;
    }
    h2 {
      color: #ffffff;
      font-size: 20px;
      border-bottom: 1px solid #24262b;
      padding-bottom: 8px;
      margin-top: 35px;
    }
    p, li {
      color: #d1d5db;
      font-size: 16px;
    }
    .history-card {
      background-color: #16181d;
      border: 1px solid #24262b;
      border-left: 4px solid #c9f24c;
      border-radius: 6px;
      padding: 20px;
      margin: 20px 0;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    }
    @media (max-width: 600px) {
      .gallery-grid { grid-template-columns: 1fr; }
    }
    .gallery-item {
      background-color: #16181d;
      border: 1px solid #24262b;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .gallery-item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background-color: #0d0e11;
    }
    .gallery-caption {
      padding: 10px 12px;
      font-size: 13px;
      color: #9da7b3;
      line-height: 1.4;
      border-top: 1px solid #24262b;
    }
    .brand-box {
      background-color: #16181d;
      border: 1px solid #24262b;
      border-radius: 8px;
      padding: 22px;
      margin-top: 20px;
    }
    .brand-display {
      background-color: #0d0e11;
      border: 1px dashed #30363d;
      border-radius: 6px;
      padding: 25px;
      text-align: center;
      margin-bottom: 15px;
    }
    .color-swatch {
      width: 90px;
      height: 90px;
      background-color: #c9f24c;
      border-radius: 8px;
      margin: 0 auto 10px auto;
      border: 2px solid #ffffff;
    }
    .badge {
      display: inline-block;
      background-color: #24262b;
      color: #c9f24c;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #24262b;
      padding: 10px;
      text-align: left;
      font-size: 14px;
    }
    th {
      background-color: #16181d;
      color: #c9f24c;
    }
    footer {
      margin-top: 60px;
      border-top: 1px solid #24262b;
      padding-top: 25px;
      font-size: 14px;
      color: #8b949e;
      text-align: center;
    }
  </style>
</head>
<body>
